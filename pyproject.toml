[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvz-ai"
version = "0.1.0"
description = "Local host for the PvZ AI native bridge"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0"]

[project.scripts]
pvz-ai = "pvz_ai.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "capstone>=5", "pefile>=2023.2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
